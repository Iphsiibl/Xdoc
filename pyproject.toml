[project]
name = "xdoc-tools"
version = "0.1.1"
description = "让 Agent 读懂任意文档：本地、离线、忠实的文档转文本层（MCP + CLI）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "agent", "document", "pdf", "ocr", "asr", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.urls]
Repository = "https://github.com/Iphsiibl/Xdoc"
Issues = "https://github.com/Iphsiibl/Xdoc/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xdoc = "xdoc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xdoc"]

# sdist 里不放可再生成的样本，否则包体会大到没必要
[tool.hatch.build.targets.sdist]
exclude = [
    "/samples",
    "/.venv",
    "/.pytest_cache",
    "/docs/acceptance_results.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
