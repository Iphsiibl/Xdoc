name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "确认发布到 PyPI（输入 xdoc-tools）"
        required: true

permissions:
  contents: read
  id-token: write # PyPI trusted publishing（OIDC）

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xdoc-tools/
    steps:
      - uses: actions/checkout@v7

      # setup-uv 没有 v10 主版本标签（只有 v10.x），必须写精确版本
      - uses: astral-sh/setup-uv@v10.4.0

      - name: 手动触发时的确认
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "${{ inputs.confirm }}" = "xdoc-tools" || (echo "确认串不对，已取消" && exit 1)

      - name: 跑测试
        run: uv sync --extra dev && uv run --extra dev pytest

      - name: 发布前自检（干净环境安装 + doctor 绿 + README 一致）
        run: uv run python tools/release_check.py

      # 幂等：这一版已经在 PyPI 上了就跳过上传（重推同名 tag 不会再撞 409）
      # 版本号从 pyproject.toml 取，不看 ref 名：手动触发时 ref 是 main/tag 名，不是版本
      - name: 查这个版本是否已发布
        id: exists
        run: |
          VERSION="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          URL="https://pypi.org/pypi/xdoc-tools/json"
          if curl -fsS "$URL" | grep -q "\"$VERSION\""; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PyPI 上已有 $VERSION，跳过上传"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 预检：只换 token 不上传，publisher 没配好时把 PyPI 的原话挂成注解
      # 这步必须留在 publish.yml 里跑：OIDC token 的 claims 里带的是「发起请求的工作流文件名」，
      # 单独建一个 check 工作流去换 token，claims 里的 workflow 是另一个文件名，
      # PyPI 一定报 422 invalid-publisher（实测过，claims 本身没问题）。
      - name: 自检 Trusted Publisher（只换 token，不上传）
        run: python3 tools/check_trusted_publisher.py

      - name: 发布到 PyPI
        if: steps.exists.outputs.exists != 'true'
        run: |
          set -o pipefail
          uv publish --trusted-publishing always 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::uv publish 失败（exit $code）"
            grep -iE "error|failed|403|409|token|publisher" publish.log | head -20 | sed 's/^/::error::/'
            exit "$code"
          fi
