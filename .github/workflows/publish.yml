name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "确认发布到 PyPI（输入 xdoc-tools）"
        required: true

permissions:
  contents: read
  id-token: write # PyPI trusted publishing（OIDC）

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xdoc-tools/
    steps:
      - uses: actions/checkout@v7

      # setup-uv 没有 v10 主版本标签（只有 v10.x），必须写精确版本
      - uses: astral-sh/setup-uv@v10.4.0

      - name: 手动触发时的确认
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "${{ inputs.confirm }}" = "xdoc-tools" || (echo "确认串不对，已取消" && exit 1)

      - name: 跑测试
        run: uv sync --extra dev && uv run --extra dev pytest

      - name: 发布前自检（干净环境安装 + doctor 绿 + README 一致）
        run: uv run python tools/release_check.py

      # 幂等：这一版已经在 PyPI 上了就跳过上传（重推同名 tag 不会再撞 409）
      - name: 查这个版本是否已发布
        id: exists
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://pypi.org/pypi/xdoc-tools/json"
          if curl -fsS "$URL" | grep -q "\"$VERSION\""; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PyPI 上已有 $VERSION，跳过上传"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 PyPI
        if: steps.exists.outputs.exists != 'true'
        run: uv publish --trusted-publishing always
