name: CI

on:
  push:
    branches: [main]
  pull_request:

# Windows 跑员的控制台代码页不是 UTF-8，统一强制 UTF-8，避免中文输出炸掉
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv 没有 v10 主版本标签（只有 v10.x），必须写精确版本
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: uv sync --extra dev

      - name: 跑测试
        run: uv run pytest

      - name: CLI 冒烟（读一个自造的 docx）
        run: |
          uv run python - <<'PY'
          import docx, pathlib, subprocess, sys
          d = docx.Document()
          d.add_heading("冒烟测试", 0)
          d.add_paragraph("正文内容，用于验证 xdoc read 的最小闭环。")
          p = pathlib.Path("smoke.docx"); d.save(p)
          out = subprocess.run([sys.executable, "-m", "xdoc", "read", str(p), "--format", "text"],
                               capture_output=True, text=True, encoding="utf-8")
          print(out.stdout)
          assert "冒烟测试" in out.stdout, out.stderr
          assert out.returncode == 0
          print("smoke ok")
          PY
