name: Trusted Publisher 自检

# 只验证「PyPI 的 Trusted Publisher 配好了没」，不发布任何东西。
# 失败时把 PyPI 的原话挂成注解，方便一眼看出是 publisher 没激活还是环境名不匹配。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # 换 OIDC token 用

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 换 token 自检（不上传）
        run: python3 tools/check_trusted_publisher.py
